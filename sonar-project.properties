sonar.projectKey=Uzair-Aslam-Dev_cohort-9-mern-7127-uzair
sonar.organization=uzair-aslam-dev

sonar.projectName=cohort-9-mern-7127-uzair
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=frontend/src,backend/src

# Test files, so Sonar doesn't count them as source lines needing coverage
sonar.tests=frontend/src,backend/tests
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.test.tsx,**/*.spec.js

# Keep noise out of analysis
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/uploads/**,**/*.test.js,**/*.test.ts,**/*.test.tsx,**/*.spec.js

# Coverage reports — one lcov.info from Jest (frontend) and one from nyc (backend)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8